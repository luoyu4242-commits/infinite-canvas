<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="星程画布，多模态 AI 创作工具" />
        <link rel="icon" type="image/png" href="%BASE_URL%xingcheng-favicon.png" />
        <link rel="apple-touch-icon" href="%BASE_URL%xingcheng-favicon.png" />
        <meta name="application-name" content="星程画布" />
        <meta name="apple-mobile-web-app-title" content="星程画布" />
        <title>星程画布</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
